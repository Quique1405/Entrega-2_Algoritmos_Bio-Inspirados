# =============================================================================
# PARTE 2 - PÉRDIDA DADO INCUMPLIMIENTO (LGD)
# Configuración del preprocesamiento
# =============================================================================
#
# Uso (desde la carpeta parte_2/):
#   python -m src.preprocesamiento --config configs/lgd.yaml
#
# Cualquier valor de este archivo se puede cambiar sin editarlo:
#   python -m src.preprocesamiento --config configs/lgd.yaml \
#       --set particion.fin_entrenamiento=2012-12-31
#
# Las rutas son relativas a la carpeta desde donde se ejecuta el comando
# (parte_2/). Los datos crudos y el diccionario de variables están en la raíz
# del repositorio porque los comparten las dos partes del trabajo.
#
# Fuente de los datos: Credit Risk Analysis (Kaggle, usuario ranadeep),
# archivo loan.csv con créditos de consumo de Lending Club.
#   - 887 379 créditos y 74 columnas.
#   - Fecha de originación (issue_d) entre 2007-06 y 2015-12.
# Significado de las columnas: ../data/LCDataDictionary.xlsx (hoja LoanStats).
# =============================================================================

semilla: 2026   # se usa solo en el modo demostración (--muestra) para el muestreo

rutas:
  datos_crudos: ../data/raw/loan.csv
  salida: data/processed              # lgd_{entrenamiento,validacion,prueba}.parquet,
                                      # preprocesador.joblib y metadatos.json
  reportes: reports/preprocesamiento  # tablas de verificación en CSV


# -----------------------------------------------------------------------------
# VARIABLE OBJETIVO
# -----------------------------------------------------------------------------
# Desenlace del crédito según loan_status, con la codificación del enunciado:
#   malo (1)  -> estados_malos
#   bueno (0) -> estados_buenos
#   sin desenlace conocido (NA): Current, Issued, In Grace Period,
#     Late (16-30 days). No se usan para ajustar nada.
#
# El LGD se construye solo con estados_lgd (créditos castigados, "charged
# off": declarados incobrables y enviados a cobranza). Motivo: las
# recuperaciones (recoveries) se registran después del castigo. Los créditos
# en Default o Late (31-120 days) son malos para el modelo de PD, pero aún no
# tienen proceso de cobro y su LGD saldría artificialmente cercano a 1.
# Evidencia (reports/preprocesamiento/recuperaciones_por_estado.csv),
# fracción de créditos con recoveries > 0:
#   Charged Off: 53 % de 45 248      Does not meet ... Charged Off: 64 % de 761
#   Default:      0 % de 1 219       Late (31-120 days):             0 % de 11 591
# El 47 % de los Charged Off no tiene ninguna recuperación: su LGD es
# exactamente 1.
#
# Fórmula (campos y definiciones del diccionario de variables):
#
#   EAD_default = funded_amnt - total_rec_prncp
#   LGD         = 1 - (recoveries - collection_recovery_fee) / EAD_default
#
#   funded_amnt             "total amount committed to that loan": lo que se
#                           desembolsó. Se prefiere a loan_amnt (lo solicitado)
#                           y a funded_amnt_inv (solo la parte de los
#                           inversionistas).
#   total_rec_prncp         "principal received to date": capital devuelto
#                           antes del incumplimiento. Solo capital, sin intereses.
#   recoveries              "post charge off gross recovery".
#   collection_recovery_fee "post charge off collection fee": se resta porque
#                           ese dinero lo retiene la agencia de cobranza.
#
# No se usa out_prncp (saldo pendiente) como denominador: vale 0 después del
# castigo.
#
# Limitaciones conocidas:
#   - No hay fechas de recuperación: no se puede descontar en el tiempo.
#   - No se incluyen intereses no cobrados ni costos internos de cobranza.
#   - Los castigos recientes pueden no haber terminado su cobranza, lo que
#     infla su LGD (afecta sobre todo a créditos de 2014 y 2015).
#
# Resultado de la corrida completa (los 46 009 castigados del archivo,
# ninguno descartado por exposición no positiva o datos faltantes):
# 38 casos con LGD < 0 antes de recortar y ninguno > 1; media 0.930,
# mediana 0.981. De ellos, los de 2015 quedan excluidos por la partición.
objetivo:
  estados_malos:
    - Charged Off
    - Default
    - Late (31-120 days)
    - "Does not meet the credit policy. Status:Charged Off"
  estados_buenos:
    - Fully Paid
    - "Does not meet the credit policy. Status:Fully Paid"
  estados_lgd:
    - Charged Off
    - "Does not meet the credit policy. Status:Charged Off"
  recortar_lgd: [0.0, 1.0]   # el LGD es una fracción; los valores fuera de
                             # rango se llevan al extremo más cercano


# -----------------------------------------------------------------------------
# PARTICIÓN TEMPORAL
# -----------------------------------------------------------------------------
# Por fecha de originación (issue_d), fechas inclusivas:
#   entrenamiento: issue_d <= fin_entrenamiento
#   validación:    fin_entrenamiento < issue_d <= fin_validacion
#   prueba:        fin_validacion < issue_d <= fin_prueba
#   excluido:      issue_d > fin_prueba (no se usa en ningún ajuste ni
#                  evaluación)
#
# Simula el uso real: el modelo aprende de créditos antiguos y se evalúa en
# créditos posteriores. La misma partición aplica a PD y LGD, para que la
# pérdida esperada E[L] = PD * LGD * EAD combine predicciones del mismo
# crédito en el mismo conjunto.
#
# Decisión: entrenamiento 2007-2012, validación 2013, prueba 2014, y 2015
# excluido. Motivo: censura. Los datos se recogieron antes de que terminaran
# muchos créditos, y la fracción de créditos sin desenlace conocido crece
# con el año de originación:
#   2007-2012: 3 %    2013: 46 %    2014: 69 %    2015: 93 %
# En 2015, los pocos créditos con desenlace son sobre todo los que fallaron muy
# rápido: su tasa de malos está inflada, y sus castigos son tan recientes que
# la cobranza probablemente no había terminado (LGD inflado). 2014 también
# tiene censura importante; queda como limitación.
# Fuente: reports/preprocesamiento/conteos_por_anio.csv.
#
# Resultado esperado con estos cortes:
#   castigados (LGD): 14 419 / 14 836 / 13 981, y 2 773 excluidos
#   con desenlace conocido en entrenamiento: 90 347 (75 618 buenos, 14 729 malos)
#
# Alternativa descartada: entrenamiento hasta 2013 y 2014 partido en
# validación y prueba. Da más datos de entrenamiento (29 255 castigados), pero
# validación y prueba saldrían del año con más censura después de 2015.
particion:
  fin_entrenamiento: "2012-12-31"   # entre comillas: sin ellas YAML lo
  fin_validacion: "2013-12-31"      # convierte en objeto fecha
  fin_prueba: "2014-12-31"          # null = todo lo posterior a fin_validacion
                                    # va a prueba


# -----------------------------------------------------------------------------
# VARIABLES DE ENTRADA
# -----------------------------------------------------------------------------
# Caso de uso: la pérdida esperada se estima al momento de aprobar el crédito.
# Por eso solo entran variables conocidas en la solicitud o la aprobación.
# Son las mismas para PD y LGD.
#
# grade e int_rate son asignadas por el propio modelo de riesgo de Lending
# Club. Se incluyen bajo el supuesto de que se evalúa un crédito ya tarificado
# (con grado y tasa asignados). Si el caso de uso es decidir sin esa
# información, deben retirarse.
variables:
  numericas:
    - loan_amnt
    - funded_amnt
    - int_rate
    - installment
    - annual_inc
    - dti
    - delinq_2yrs
    - inq_last_6mths
    - open_acc
    - pub_rec
    - revol_bal
    - revol_util
    - total_acc
    # Derivadas, calculadas en src/preprocesamiento.py:
    - plazo_meses              # de term (" 36 months" -> 36)
    - antiguedad_empleo        # de emp_length ("< 1 year" -> 0,
                               # "10+ years" -> 10, "n/a" -> faltante).
                               # El diccionario la describe como número de 0 a
                               # 10, pero en el archivo viene como texto.
    - meses_historial_credito  # meses entre earliest_cr_line e issue_d
  categoricas:
    - grade
    - home_ownership
    - verification_status
    - purpose
    - initial_list_status

# Columnas que solo se conocen después de otorgar el crédito (pagos,
# recuperaciones, fechas de pago). Usarlas como entrada sería fuga de
# información. El código se detiene si alguna aparece en las variables de
# entrada o en las columnas de las que salen las variables derivadas.
# Algunas sí se usan, pero solo para construir el LGD y la EAD.
prohibidas:
  - loan_status
  - out_prncp
  - out_prncp_inv
  - total_pymnt
  - total_pymnt_inv
  - total_rec_prncp
  - total_rec_int
  - total_rec_late_fee
  - recoveries
  - collection_recovery_fee
  - last_pymnt_d
  - last_pymnt_amnt
  - next_pymnt_d
  - last_credit_pull_d


# -----------------------------------------------------------------------------
# PREPROCESAMIENTO
# -----------------------------------------------------------------------------
# Los parámetros (medianas, medias, desviaciones estándar, categorías
# frecuentes) se ajustan con TODOS los créditos de entrenamiento con desenlace
# conocido (buenos y malos; 90 347 con la partición actual), no solo con los
# castigados. Así PD y LGD comparten exactamente la misma transformación de
# cada crédito. Validación y prueba nunca intervienen en el ajuste.
#
# El preprocesador ajustado se guarda en data/processed/preprocesador.joblib
# para transformar créditos nuevos (por ejemplo, en la aplicación web).
#
# Además de los castigados (lgd_*.parquet), se guarda la población completa
# con desenlace conocido de cada conjunto (poblacion_*.parquet), con la misma
# transformación y la variable 'malo'. Sirve para entrenar la PD (parte 1) con
# el mismo preprocesamiento y para la pérdida esperada. Por tamaño no se sube
# al repositorio (.gitignore); se regenera corriendo este preprocesamiento.
preprocesamiento:
  imputacion_numerica: median   # median | mean. La mediana es robusta a los
                                # valores extremos de annual_inc y revol_bal.
  indicador_faltante: true      # agrega una columna 0/1 por cada variable que
                                # tenía faltantes en entrenamiento
  escalado: estandar            # estandar: media 0 y desviación estándar 1
                                # minmax_pm1: rango [-1, 1], como en los
                                # notebooks del curso
  categoria_frecuencia_minima: 0.005  # categorías con menos del 0.5 % de los
                                      # créditos se agrupan en una sola
                                      # ("infrequent")


# -----------------------------------------------------------------------------
# LÍNEA BASE Y MODELO DE REFERENCIA (src/referencia_lgd.py)
# -----------------------------------------------------------------------------
# Se ajustan solo con entrenamiento y se evalúan en los tres conjuntos.
#   nulo_media:   predice siempre el LGD promedio de entrenamiento (la mejor
#                 constante para el RMSE). Equivale a una regresión lineal con
#                 solo intercepto. No lo exige el enunciado: sirve para medir
#                 cuánto aportan las variables de entrada.
#   nulo_mediana: predice siempre la mediana de entrenamiento (la mejor
#                 constante para el MAE).
#   lineal:       regresión lineal por mínimos cuadrados ordinarios. Es el
#                 modelo de baja complejidad que pide el enunciado.
#
# La codificación one-hot conserva todas las categorías, así que las columnas
# de cada variable categórica suman 1 y son colineales con el intercepto.
# Mínimos cuadrados lo resuelve (solución de norma mínima) y las predicciones
# no se ven afectadas, pero los coeficientes individuales no se pueden
# interpretar como efectos aislados.
referencia:
  resultados: results/referencia      # métricas, calibración, modelos guardados
  figuras: figures/referencia
  conjuntos_figuras: [validacion, prueba]
  recortar_prediccion_lineal: false   # la regresión lineal puede predecir
                                      # fuera de [0, 1]; false reporta el modelo
                                      # tal cual y cuenta esos casos


# -----------------------------------------------------------------------------
# RED NEURONAL (src/red_lgd.py)
# -----------------------------------------------------------------------------
# Perceptrón multicapa con una neurona de salida y activación sigmoide, para
# que la predicción quede en (0, 1), igual que el LGD.
#
# Funciones de pérdida (ambas derivables por máxima verosimilitud):
#   bce: entropía cruzada binaria con objetivo fraccional. Cuasi-verosimilitud
#        de Bernoulli aplicada a y en [0, 1] (fractional logit; Papke y
#        Wooldridge, 1996). Su mínimo poblacional es E[y | x] y admite y = 0
#        o y = 1 exactos (casi la mitad de los castigados tiene LGD = 1).
#   mse: error cuadrático medio. Corresponde a un modelo gaussiano con media
#        sigmoide(z).
#
# Regularización:
#   - dropout en cada capa oculta;
#   - penalización L2 aplicada como weight_decay del optimizador: se suma
#     lambda * theta al gradiente, equivalente a sumar (lambda / 2) * ||theta||^2
#     a la pérdida (en Adam no es lo mismo que AdamW);
#   - parada temprana con la pérdida de validación: se detiene tras
#     'paciencia' épocas sin mejorar y se restauran los pesos de la mejor época.
#
# Validación se usa para la parada temprana y para elegir la configuración en
# la búsqueda. Prueba no interviene en ninguna decisión.
#
# Modos de ejecución (desde parte_2/):
#   --modo entrenar   una configuración, una semilla (sección 'entrenar').
#                     Para pruebas y cambios en vivo; escribe en
#                     results/red/entrenar y no toca el modelo final.
#   --modo busqueda   búsqueda aleatoria de hiperparámetros (sección 'busqueda');
#                     guarda la mejor en results/red/mejor_configuracion.yaml
#   --modo semillas   entrena la mejor configuración con n semillas y reporta
#                     media, desviación estándar, mínimo y máximo. Guarda como
#                     modelo final (results/red/modelo_red.pt) el de mejor
#                     validación.
#   --demo            reduce datos, épocas, configuraciones y semillas para una
#                     corrida de menos de 2 min; escribe en subcarpetas 'demo'
#
# Orden de uso: busqueda -> semillas. Comparación justa: el número de
# configuraciones, el tiempo total y los parámetros de cada modelo quedan en
# busqueda_resumen.json, semillas_info.json y resumen_semillas.csv.
red:
  resultados: results/red
  figuras: figures/red
  conjuntos_figuras: [validacion, prueba]
  metrica_seleccion: rmse        # rmse | mae, en validación; común a bce y mse

  entrenar:                      # configuración del modo 'entrenar'
    semilla: 2026
    capas_ocultas: [64, 32]      # neuronas por capa oculta
    activacion: relu             # relu | tanh | elu
    dropout: 0.1
    perdida: bce                 # bce | mse
    optimizador: adam            # adam | sgd (SGD con momento 0.9)
    tasa_aprendizaje: 0.001
    penalizacion_l2: 0.0001
    tamano_lote: 256
    epocas_max: 200
    paciencia: 15

  busqueda:
    configuraciones: 40          # presupuesto: número de configuraciones
    semilla: 2026                # semilla del muestreo de configuraciones y
                                 # del entrenamiento de cada una
    epocas_max: 200
    paciencia: 15
    # Búsqueda aleatoria (Bergstra y Bengio, 2012): con el mismo presupuesto
    # explora más valores distintos de cada hiperparámetro que una rejilla.
    espacio:
      capas_ocultas: [[16], [32], [64], [32, 16], [64, 32], [128, 64], [64, 32, 16]]
      activacion: [relu, tanh, elu]
      dropout: [0.0, 0.1, 0.2, 0.3]
      perdida: [bce, mse]
      optimizador: [adam, sgd]
      tasa_aprendizaje: {log_uniforme: [0.0001, 0.01]}
      penalizacion_l2: {log_uniforme: [0.000001, 0.01]}
      tamano_lote: [128, 256, 512]

  semillas:
    n: 30
    primera: 1                   # se usan las semillas 1, 2, ..., n
    # Configuración a repetir. Si existe el archivo de la búsqueda, se usa ese;
    # si no, se usa la sección 'entrenar'.
    configuracion: results/red/mejor_configuracion.yaml

  demo:
    fraccion_entrenamiento: 0.3  # fracción de créditos de entrenamiento
    epocas_max: 30
    configuraciones: 4           # para --modo busqueda --demo
    n_semillas: 3                # para --modo semillas --demo


# -----------------------------------------------------------------------------
# INTERCAMBIO CON LA PARTE 1 Y PÉRDIDA ESPERADA (src/perdida_esperada.py)
# -----------------------------------------------------------------------------
# La parte 1 entrega la PD de cada crédito de prueba en un CSV, con el formato
# descrito en ../intercambio/LEEME.md:
#   columnas obligatorias: id, pd       (pd en [0, 1])
#   columna opcional:      modelo       (nombre del modelo que produjo la PD)
#   filas: exactamente los créditos de data/processed/poblacion_prueba.parquet
#          (todos los de prueba con desenlace conocido, buenos y malos)
#
# Mientras no exista la PD real, src/pd_provisional.py escribe en el mismo
# archivo una PD provisional (regresión logística con las mismas entradas),
# marcada con modelo = provisional_regresion_logistica. Cuando la parte 1
# sobrescribe el archivo, basta volver a correr src/perdida_esperada.py.
#
# Pérdida esperada de cada crédito, calculada al momento de la aprobación:
#   E[L] = PD * LGD * EAD
#   PD:  del archivo de intercambio.
#   LGD: predicción del modelo de esta parte. Se entrenó con castigados, pero
#        responde "si este crédito incumpliera, qué fracción se perdería", así
#        que se aplica a todos los créditos de prueba.
#   EAD: según 'ead' (abajo).
#
# Pérdida observada, para comparar el total de E[L] en prueba:
#   castigados:            ead_default * LGD real (dato completo).
#   Default y Late (31-120 days): sin cobranza todavía, pérdida final
#     desconocida. Se reporta un rango: cota inferior sin ellos, cota superior
#     suponiendo que pierden toda su ead_default (LGD = 1).
#   buenos: pérdida 0.
perdida_esperada:
  archivo_pd: ../intercambio/pd_prueba.csv
  modelo_lgd: red               # red | lineal
  ead: fraccion_pendiente       # monto | fraccion_pendiente
  # monto:              EAD = funded_amnt. Supone incumplimiento inmediato;
  #                     sobreestima la pérdida.
  # fraccion_pendiente: EAD = funded_amnt * c, con c la fracción promedio del
  #                     monto que seguía pendiente al incumplir, estimada en los
  #                     castigados de ENTRENAMIENTO, separada por plazo (36 y 60
  #                     meses), porque los créditos largos amortizan capital más
  #                     despacio. Coherente con la definición del LGD, que se
  #                     mide sobre la deuda pendiente al incumplir.
  resultados: results/perdida_esperada
  figuras: figures/perdida_esperada
  grupos_calibracion: 10
