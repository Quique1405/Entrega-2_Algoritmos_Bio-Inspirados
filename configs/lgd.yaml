# =============================================================================
# Configuración del preprocesamiento para el modelo de LGD
# (pérdida dado incumplimiento). Todo lo que deba coincidir con el modelo de
# PD del equipo está aquí, no en el código.
# =============================================================================

semilla: 2026

rutas:
  datos_crudos: data/raw/loan.csv          # archivo descargado de Kaggle
  salida: data/processed                   # aquí se escriben los parquet
  reportes: reports/preprocesamiento       # tablas de verificación (csv)

# -----------------------------------------------------------------------------
# Variable objetivo
# -----------------------------------------------------------------------------
objetivo:
  # Estados que el enunciado codifica como "malo" (valor 1).
  estados_malos:
    - Charged Off
    - Default
    - Late (31-120 days)
    - "Does not meet the credit policy. Status:Charged Off"
  # Estados que el enunciado codifica como "bueno" (valor 0).
  estados_buenos:
    - Fully Paid
    - "Does not meet the credit policy. Status:Fully Paid"
  # Subconjunto de malos con proceso de cobro terminado (castigados):
  # solo con estos se construye el LGD.
  estados_lgd:
    - Charged Off
    - "Does not meet the credit policy. Status:Charged Off"
  recortar_lgd: [0.0, 1.0]

# -----------------------------------------------------------------------------
# Partición temporal por fecha de originación (issue_d), fechas inclusivas.
# Entrenamiento: issue_d <= fin_entrenamiento
# Validación:    fin_entrenamiento < issue_d <= fin_validacion
# Prueba:        issue_d > fin_validacion
# REVISAR con reports/preprocesamiento/conteos_por_anio.csv antes de fijarlas.
# -----------------------------------------------------------------------------
particion:
  fin_entrenamiento: "2013-12-31"
  fin_validacion: "2014-12-31"

# -----------------------------------------------------------------------------
# Variables de entrada: SOLO información disponible al solicitar el crédito.
# -----------------------------------------------------------------------------
variables:
  numericas:
    - loan_amnt
    - funded_amnt
    - int_rate
    - installment
    - annual_inc
    - dti
    - delinq_2yrs
    - inq_last_6mths
    - open_acc
    - pub_rec
    - revol_bal
    - revol_util
    - total_acc
    # Derivadas (las calcula el código a partir de columnas originales):
    - plazo_meses              # de 'term'
    - antiguedad_empleo        # de 'emp_length'
    - meses_historial_credito  # de issue_d - earliest_cr_line
  categoricas:
    - grade
    - home_ownership
    - verification_status
    - purpose
    - initial_list_status

# Columnas que se conocen DESPUÉS de otorgar el crédito. Si alguna aparece en
# las variables de entrada, el código se detiene (protección contra fuga).
prohibidas:
  - loan_status
  - out_prncp
  - out_prncp_inv
  - total_pymnt
  - total_pymnt_inv
  - total_rec_prncp
  - total_rec_int
  - total_rec_late_fee
  - recoveries
  - collection_recovery_fee
  - last_pymnt_d
  - last_pymnt_amnt
  - next_pymnt_d
  - last_credit_pull_d

# -----------------------------------------------------------------------------
# Preprocesamiento. Sus parámetros (medianas, medias, desviaciones,
# categorías) se ajustan con TODOS los créditos de entrenamiento con
# desenlace conocido (buenos + malos), igual que en el modelo de PD.
# -----------------------------------------------------------------------------
preprocesamiento:
  imputacion_numerica: median      # median | mean
  indicador_faltante: true         # agrega columna 0/1 "era faltante"
  escalado: estandar               # estandar (media 0, desv. 1) | minmax_pm1 (rango [-1, 1])
  categoria_frecuencia_minima: 0.005  # categorías más raras se agrupan en "infrequent"
